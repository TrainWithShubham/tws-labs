# TWS Labs — Universal Docker Compose Configuration
# Supports both:
#   1. Local execution:  docker compose up --build  (opens http://localhost:8080, loopback only)
#   2. Hosted execution: LAB_PROFILE=hosted ALLOWED_HOSTS=... docker compose up -d
# See .env.example for all configuration options.
services:
  labs:
    build: .
    image: tws-labs:dev
    ports:
      # Localhost only by default for local mode. For hosted mode behind a reverse proxy, set LABS_BIND_IP=0.0.0.0
      - "${LABS_BIND_IP:-127.0.0.1}:${LABS_PORT:-8080}:8080"
    environment:
      LAB_PROFILE: ${LAB_PROFILE:-local}
      LABS_WATCH: ${LABS_WATCH:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      LAB_ACCESS_TOKENS: ${LAB_ACCESS_TOKENS:-}
      PUBLIC_CHALLENGES: ${PUBLIC_CHALLENGES:-0}
      LAB_GATED: ${LAB_GATED:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      MAX_SESSIONS: ${MAX_SESSIONS:-}
      MAX_SESSIONS_PER_IP: ${MAX_SESSIONS_PER_IP:-}
      LAB_IDLE_MIN: ${LAB_IDLE_MIN:-}
      LAB_HARD_CAP_MIN: ${LAB_HARD_CAP_MIN:-}
      USAGE_STATS: ${USAGE_STATS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - ./labs:/app/labs:ro
      - ./challenges:/app/challenges:ro
    cpus: ${CPUS:-1.0}
    mem_limit: ${MEM_LIMIT:-512m}
    pids_limit: ${PIDS_LIMIT:-512}
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /sandbox:size=${SANDBOX_TMPFS_SIZE:-128m},mode=0755,exec
    restart: unless-stopped
