requires: emulator
title: DynamoDB tables and queries
level: beginner
minutes: 15
summary: The real AWS CLI on a local AWS Emulator - keys, batch writes, queries, conditions, TTL. No account.
links:
  - title: DynamoDB core components
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.CoreComponents.html
resources:
  - title: DynamoDB core components
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.CoreComponents.html
    desc: Tables, items, attributes and the primary key.
  - title: Working with queries in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Query.html
    desc: Key condition expressions, and why a query beats a scan.
  - title: Time to Live (TTL)
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
    desc: Expiring items automatically.
steps:
  - id: intro
    type: lesson
    title: A table with a key
    body: |
      This lab runs the **real AWS CLI** against the **AWS Emulator**, AWS's local stand-in for its APIs: no account, no cost, and everything vanishes when the emulator restarts.

      A DynamoDB table is defined by its **primary key**: a *partition key*, and optionally a *sort key*. Every fast read goes through the key, so choosing it is the whole design. You will build an `orders` table keyed by `customer` and `orderId`, load it, query it, update it safely and let old items expire.

      The emulator does not enforce IAM permissions for users and roles, and it is one account in one region (`us-east-1`).
  - id: create-table
    type: task
    title: Create the table
    body: |
      Create a table named `orders` with a **partition key** `customer` and a **sort key** `orderId`, both strings. Use **on-demand** billing, so there is no capacity to plan.
    hint:
      - "The operation is `aws dynamodb create-table`. It needs `--attribute-definitions`, `--key-schema` and a billing choice."
      - "Each key attribute is declared twice: its type in the attribute definitions (`AttributeType=S` is a string), and its role in the key schema (`KeyType=HASH` for the partition key, `RANGE` for the sort key)."
      - "On-demand billing is `--billing-mode PAY_PER_REQUEST`. A new table takes a moment to become ACTIVE: check `describe-table --query Table.TableStatus --output text` before you write to it."
    success: A table keyed by customer and order. Every lookup will go through that key.
  - id: load-orders
    type: task
    title: Load three orders in one call
    body: |
      `orders.json` in your home folder describes three orders as a batch of `PutRequest`s. Load them into the table with **one** `batch-write-item` call.
    hint:
      - "`batch-write-item` takes `--request-items`, and the CLI can read it from a file: `file://orders.json`."
      - "The table name is already inside the file, as the key of the request map."
    success: Three items in, in a single round trip.
  - id: query-alice
    type: task
    title: Ask by key, not by scanning
    body: |
      How many orders does `alice` have? Use a **query** on the partition key, and save just the number in `alice-orders.txt`.
    hint:
      - "`aws dynamodb query` reads by key. It needs `--key-condition-expression` and the values it refers to."
      - "Write the condition as `customer = :c`, and give `:c` its value with `--expression-attribute-values`: `{\":c\":{\"S\":\"alice\"}}`."
      - "`--query Count --output text` prints only the number; redirect it into the file."
    success: A query touches only alice's items. A scan would have read the whole table.
  - id: ship-order
    type: task
    title: Ship it only once
    body: |
      Mark alice's order `o-1` as shipped: set its `status` to `SHIPPED`, but **only if its status is still `PLACED`**, so a repeated command can never ship an order twice. Leave her other order alone.
    hint:
      - "`aws dynamodb update-item` changes one item, named by its full key (`customer` and `orderId`)."
      - "`--update-expression \"SET #s = :new\"` makes the change. `status` is a reserved word in DynamoDB, so give it a placeholder with `--expression-attribute-names`."
      - "`--condition-expression \"#s = :old\"` makes it conditional. Run it twice: the second time DynamoDB refuses, and that is the point."
    success: Shipped once, and safe to run again.
  - id: expire-items
    type: task
    title: Let old items expire
    body: |
      Orders can carry an `expiresAt` timestamp. Turn on **Time to Live** for the table so DynamoDB removes items after that time on its own.
    hint:
      - "TTL has its own operation: `aws dynamodb update-time-to-live`."
      - "Its specification names the attribute and switches it on: `Enabled=true,AttributeName=expiresAt`."
    success: Items now clean themselves up.
  - id: wrap-up
    type: lesson
    title: What you can do now
    body: |
      - Design a table around its partition and sort keys, with on-demand billing.
      - Load many items at once with `batch-write-item`.
      - Read by key with `query`, instead of reading everything with `scan`.
      - Make a write safe with a **condition expression**, and expire items with TTL.

      Next: queues and topics, the other half of a serverless design.
