title: Comprehensive AWS Resource & FinOps Audit
level: intermediate
minutes: 15
summary: Audit AWS services and identify idle resources across compute, storage, database, and networking.
steps:
  - id: intro
    type: lesson
    title: Understanding AWS FinOps Audits
    body: |
      Cloud cost optimization begins with visibility. In this lab you audit
      compute, storage, databases, serverless and networking to find idle
      assets that cause cloud waste.

      There are no real AWS credentials here. The `aws` command is a stub
      that returns a sample account, one resource per line, so `grep`,
      `cut` and `tr` are all you need.
  - id: step-1
    type: task
    title: Audit Compute & Serverless (EC2, Lambda)
    body: |
      First run `export PATH="$HOME/bin:$PATH"` so the practice `aws` command is found.

      1. List the running EC2 instances and save their Instance IDs to `active_ec2.txt`, one per line.
      2. List all deployed Lambda functions and save their names to `active_lambda.txt`, one per line.
    hint: "Use `aws ec2 describe-instances` and `aws lambda list-functions`. Skip stopped instances."
  - id: step-2
    type: task
    title: Audit Storage Waste (EBS & S3 Buckets)
    body: |
      1. Find the unattached EBS volumes (state `available`) and save their Volume IDs to `unattached_ebs.txt`.
      2. List all S3 buckets and save their names to `s3_buckets.txt`.
    hint: "Use `aws ec2 describe-volumes` and `aws s3api list-buckets`. In-use volumes are not waste."
  - id: step-3
    type: task
    title: Audit Databases & Cache (RDS & DynamoDB)
    body: |
      1. List all RDS database instances and save the DB Identifiers to `rds_instances.txt`.
      2. List all DynamoDB tables and save the table names to `dynamodb_tables.txt`.
    hint: "Use `aws rds describe-db-instances` and `aws dynamodb list-tables`."
  - id: step-4
    type: task
    title: Audit Networking & Gateways (EIP & NAT)
    body: |
      1. Find the unassociated Elastic IPs and save their Allocation IDs to `idle_eips.txt`.
      2. List the NAT Gateways in the `available` state and save their IDs to `nat_gateways.txt`.
    hint: "Use `aws ec2 describe-addresses` and `aws ec2 describe-nat-gateways`. An unassociated address has a null AssociationId."
